    - data:
        code: "import json\nimport re\n\n\ndef parse_allowed_operations(raw_text:\
          \ str):\n    \"\"\"\n    将 Start 节点传入的 allowed_operations\n    转换成工序名称列表。\n\
          \n    支持：\n    1. JSON Array\n    2. 一行一个工序\n    3. 带 - / * / • / 1. 等列表符号\n\
          \    \"\"\"\n\n    text = (raw_text or \"\").strip()\n\n    if not text:\n\
          \        return []\n\n    # 先尝试 JSON Array\n    try:\n        parsed = json.loads(text)\n\
          \n        if isinstance(parsed, list):\n            result = []\n\n    \
          \        for item in parsed:\n                if isinstance(item, str) and\
          \ item.strip():\n                    result.append(item.strip())\n\n   \
          \         return result\n\n    except Exception:\n        pass\n\n    #\
          \ 普通多行文本\n    operations = []\n\n    for line in text.splitlines():\n\n\
          \        line = line.strip()\n\n        if not line:\n            continue\n\
          \n        # 去除常见 bullet\n        line = re.sub(\n            r\"^\\s*[-*•]+\\\
          s*\",\n            \"\",\n            line\n        )\n\n        # 去除 1.\
          \ / 1、 / 1) 等编号\n        line = re.sub(\n            r\"^\\s*\\d+\\s*[.)、]\\\
          s*\",\n            \"\",\n            line\n        )\n\n        line =\
          \ line.strip()\n\n        if line:\n            operations.append(line)\n\
          \n    return operations\n\n\ndef main(llm_text: str, allowed_operations:\
          \ str):\n    issues = []\n\n    text = (llm_text or \"\").strip()\n\n  \
          \  # =========================================================\n    # 0.\
          \ 清理 LLM 输出\n    # =========================================================\n\
          \n    # 清理 DeepSeek <think>...</think>\n    text = re.sub(\n        r\"\
          <think>.*?</think>\",\n        \"\",\n        text,\n        flags=re.DOTALL\
          \ | re.IGNORECASE\n    ).strip()\n\n    # 清理 Markdown code fence\n    text\
          \ = re.sub(\n        r\"^```json\\s*\",\n        \"\",\n        text,\n\
          \        flags=re.IGNORECASE\n    )\n\n    text = re.sub(\n        r\"^```\\\
          s*\",\n        \"\",\n        text\n    )\n\n    text = re.sub(\n      \
          \  r\"\\s*```$\",\n        \"\",\n        text\n    ).strip()\n\n    # =========================================================\n\
          \    # 1. 解析 allowed_operations\n    # =========================================================\n\
          \n    allowed_list = parse_allowed_operations(\n        allowed_operations\n\
          \    )\n\n    allowed_set = set(allowed_list)\n\n    if not allowed_list:\n\
          \        issues.append(\n            \"allowed_operations 为空或无法解析\"\n  \
          \      )\n\n    # =========================================================\n\
          \    # 2. JSON 解析\n    # =========================================================\n\
          \n    try:\n        result = json.loads(text)\n\n    except Exception as\
          \ e:\n\n        return {\n            \"result_json\": \"{}\",\n       \
          \     \"valid\": False,\n            \"issues\": [\n                f\"\
          LLM 输出无法解析为 JSON：{str(e)}\"\n            ]\n        }\n\n    if not isinstance(result,\
          \ dict):\n\n        return {\n            \"result_json\": \"{}\",\n   \
          \         \"valid\": False,\n            \"issues\": [\n               \
          \ \"LLM 输出不是 JSON Object\"\n            ]\n        }\n\n    # =========================================================\n\
          \    # 3. 顶层字段\n    # =========================================================\n\
          \n    required_top_fields = [\n        \"status\",\n        \"analysis_summary\"\
          ,\n        \"candidates\",\n        \"missing_information\",\n        \"\
          ambiguities\",\n        \"needs_human_review\"\n    ]\n\n    for field in\
          \ required_top_fields:\n\n        if field not in result:\n            issues.append(\n\
          \                f\"缺少顶层字段 {field}\"\n            )\n\n    # =========================================================\n\
          \    # 4. status\n    # =========================================================\n\
          \n    status = result.get(\"status\")\n\n    allowed_status = {\n      \
          \  \"CANDIDATES\",\n        \"UNKNOWN\"\n    }\n\n    if status not in allowed_status:\n\
          \n        issues.append(\n            \"status 必须为 CANDIDATES 或 UNKNOWN\"\
          \n        )\n\n    # =========================================================\n\
          \    # 5. analysis_summary\n    # =========================================================\n\
          \n    analysis_summary = result.get(\n        \"analysis_summary\"\n   \
          \ )\n\n    if (\n        not isinstance(analysis_summary, str)\n       \
          \ or not analysis_summary.strip()\n    ):\n        issues.append(\n    \
          \        \"analysis_summary 必须为非空字符串\"\n        )\n\n    # =========================================================\n\
          \    # 6. candidates\n    # =========================================================\n\
          \n    candidates = result.get(\"candidates\")\n\n    if not isinstance(candidates,\
          \ list):\n\n        issues.append(\n            \"candidates 必须为数组\"\n \
          \       )\n\n        candidates = []\n\n    else:\n\n        # 最多 3 个候选\n\
          \        if len(candidates) > 3:\n\n            issues.append(\n       \
          \         \"candidates 最多只能包含 3 个候选工序\"\n            )\n\n        # UNKNOWN\
          \ 必须没有候选\n        if (\n            status == \"UNKNOWN\"\n            and\
          \ len(candidates) != 0\n        ):\n            issues.append(\n       \
          \         \"status=UNKNOWN 时 candidates 必须为空数组\"\n            )\n\n    \
          \    # CANDIDATES 至少一个\n        if (\n            status == \"CANDIDATES\"\
          \n            and len(candidates) == 0\n        ):\n            issues.append(\n\
          \                \"status=CANDIDATES 时至少需要一个 candidate\"\n            )\n\
          \n    seen_operations = set()\n\n    for i, candidate in enumerate(candidates):\n\
          \n        candidate_no = i + 1\n\n        if not isinstance(candidate, dict):\n\
          \n            issues.append(\n                f\"第 {candidate_no} 个 candidate\
          \ 格式错误\"\n            )\n\n            continue\n\n        required_candidate_fields\
          \ = [\n            \"rank\",\n            \"operation\",\n            \"\
          confidence_score\",\n            \"reason\",\n            \"evidence\"\n\
          \        ]\n\n        for field in required_candidate_fields:\n\n      \
          \      if field not in candidate:\n\n                issues.append(\n  \
          \                  f\"第 {candidate_no} 个 candidate \"\n                \
          \    f\"缺少 {field}\"\n                )\n\n        # -----------------------------------------------------\n\
          \        # rank\n        # -----------------------------------------------------\n\
          \n        rank = candidate.get(\"rank\")\n\n        if rank != candidate_no:\n\
          \n            issues.append(\n                f\"第 {candidate_no} 个 candidate\
          \ \"\n                f\"rank 应为 {candidate_no}\"\n            )\n\n   \
          \     # -----------------------------------------------------\n        #\
          \ operation\n        # -----------------------------------------------------\n\
          \n        operation = candidate.get(\n            \"operation\"\n      \
          \  )\n\n        if (\n            not isinstance(operation, str)\n     \
          \       or not operation.strip()\n        ):\n\n            issues.append(\n\
          \                f\"第 {candidate_no} 个 candidate \"\n                f\"\
          operation 必须为非空字符串\"\n            )\n\n        else:\n\n            operation\
          \ = operation.strip()\n\n            # 核心安全检查：\n            # 工序必须来自 allowed_operations\n\
          \            if operation not in allowed_set:\n\n                issues.append(\n\
          \                    f\"第 {candidate_no} 个 candidate \"\n              \
          \      f\"工序 '{operation}' \"\n                    f\"不在 allowed_operations\
          \ 中\"\n                )\n\n            # 禁止重复候选\n            if operation\
          \ in seen_operations:\n\n                issues.append(\n              \
          \      f\"候选工序重复：{operation}\"\n                )\n\n            else:\n\
          \n                seen_operations.add(\n                    operation\n\
          \                )\n\n        # -----------------------------------------------------\n\
          \        # confidence_score\n        # -----------------------------------------------------\n\
          \n        confidence_score = candidate.get(\n            \"confidence_score\"\
          \n        )\n\n        # bool 在 Python 也是 int，\n        # 所以要单独排除\n    \
          \    if (\n            isinstance(confidence_score, bool)\n            or\
          \ not isinstance(\n                confidence_score,\n                int\n\
          \            )\n        ):\n\n            issues.append(\n             \
