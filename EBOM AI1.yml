          ,\n        \"filter_logic\",\n        \"filters\",\n        \"output_ref\"\
          ,\n        \"operation\",\n        \"validation\",\n        \"description\"\
          \n    ]\n\n    if not isinstance(steps, list) or not steps:\n        issues.append(\n\
