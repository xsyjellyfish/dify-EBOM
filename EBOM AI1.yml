        code: "import json\nimport re\n\n\ndef main(llm_text: str):\n    issues =\
          \ []\n\n    text = (llm_text or \"\").strip()\n\n    # =========================================================\n\
          \    # 0. 清理 LLM 输出\n    # =========================================================\n\
          \n    # 清理 DeepSeek 可能混入的 <think>...</think>\n    text = re.sub(\n     \
          \   r\"<think>.*?</think>\",\n        \"\",\n        text,\n        flags=re.DOTALL\
          \ | re.IGNORECASE\n    ).strip()\n\n    # 清理 Markdown code fence\n    text\
          \ = re.sub(\n        r\"^```json\\s*\",\n        \"\",\n        text,\n\
          \        flags=re.IGNORECASE\n    )\n    text = re.sub(r\"^```\\s*\", \"\
          \", text)\n    text = re.sub(r\"\\s*```$\", \"\", text).strip()\n\n    #\
          \ =========================================================\n    # 1. JSON\
          \ 解析\n    # =========================================================\n\n\
          \    try:\n        rule = json.loads(text)\n    except Exception as e:\n\
          \        return {\n            \"rule_json\": \"{}\",\n            \"valid\"\
          : False,\n            \"issues\": [\n                f\"LLM 输出无法解析为 JSON：{str(e)}\"\
          \n            ]\n        }\n\n    if not isinstance(rule, dict):\n     \
          \   return {\n            \"rule_json\": \"{}\",\n            \"valid\"\
          : False,\n            \"issues\": [\n                \"LLM 输出不是 JSON Object\"\
          \n            ]\n        }\n\n    # =========================================================\n\
          \    # 2. 顶层字段检查\n    # =========================================================\n\
          \n    required_top_fields = [\n        \"rule_name\",\n        \"source_tables\"\
          ,\n        \"trigger_logic\",\n        \"conditions\",\n        \"steps\"\
          ,\n        \"ambiguities\",\n        \"needs_human_review\"\n    ]\n\n \
          \   for field in required_top_fields:\n        if field not in rule:\n \
          \           issues.append(\n                f\"缺少顶层字段 {field}\"\n      \
          \      )\n\n    if not rule.get(\"rule_name\"):\n        issues.append(\n\
          \            \"rule_name 不能为空\"\n        )\n\n    source_tables = rule.get(\"\
          source_tables\")\n\n    if not isinstance(source_tables, list) or not source_tables:\n\
          \        issues.append(\n            \"source_tables 必须为非空数组\"\n       \
          \ )\n    else:\n        for i, table in enumerate(source_tables):\n    \
          \        if not isinstance(table, str) or not table.strip():\n         \
