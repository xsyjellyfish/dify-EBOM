          \n                )\n\n    # =========================================================\n\
          \    # 3. trigger_logic\n    # =========================================================\n\
          \n    allowed_trigger_logic = {\n        \"SINGLE\",\n        \"AND\",\n\
          \        \"OR\"\n    }\n\n    trigger_logic = rule.get(\"trigger_logic\"\
          )\n\n    if trigger_logic not in allowed_trigger_logic:\n        issues.append(\n\
          \            \"trigger_logic 必须为 SINGLE / AND / OR\"\n        )\n\n    #\
          \ =========================================================\n    # 4. conditions\n\
          \    # =========================================================\n\n   \
          \ conditions = rule.get(\"conditions\")\n\n    allowed_operators = {\n \
          \       \"equals\",\n        \"contains\",\n        \"starts_with\",\n \
          \       \"ends_with\",\n        \"in\",\n        \"not_equals\",\n     \
          \   \"greater_than\",\n        \"less_than\",\n        \"greater_or_equal\"\
          ,\n        \"less_or_equal\",\n        \"other\"\n    }\n\n    if not isinstance(conditions,\
          \ list) or not conditions:\n        issues.append(\n            \"conditions\
          \ 必须为非空数组\"\n        )\n\n    else:\n        for i, condition in enumerate(conditions):\n\
          \n            condition_no = i + 1\n\n            if not isinstance(condition,\
          \ dict):\n                issues.append(\n                    f\"第 {condition_no}\
          \ 个 condition 格式错误\"\n                )\n                continue\n\n  \
          \          required_condition_fields = [\n                \"source_table\"\
          ,\n                \"field\",\n                \"operator\",\n         \
          \       \"value\"\n            ]\n\n            for field in required_condition_fields:\n\
          \                if field not in condition:\n                    issues.append(\n\
          \                        f\"第 {condition_no} 个 condition 缺少 {field}\"\n\
          \                    )\n\n            source_table = condition.get(\"source_table\"\
          )\n            field_name = condition.get(\"field\")\n            operator\
          \ = condition.get(\"operator\")\n\n            # source_table / field 字段必须存在，但值允许为\
