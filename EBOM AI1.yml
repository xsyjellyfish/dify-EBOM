          \n    steps = rule.get(\"steps\")\n\n    allowed_action_types = {\n    \
          \    \"identify_material\",\n        \"assign_operation\",\n        \"select_children\"\
          ,\n        \"filter_materials\",\n        \"mark_status\",\n        \"quantity_validation\"\
